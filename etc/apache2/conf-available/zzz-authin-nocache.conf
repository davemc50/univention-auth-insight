# Auth Insight: UCS defaults to max-age=3600 for *.js which hides fresh deploys.
# Browser loads /univention/management/modules/authin.js (symlink to js/umc/modules).
# Must load after univention-web.conf (zzz- prefix).
<LocationMatch "^/univention/management/modules/authin\.(js|css)$">
	Header set Cache-Control "no-cache, no-store, must-revalidate"
	Header set Pragma "no-cache"
	Header unset Expires
</LocationMatch>
<LocationMatch "^/univention/management/modules/i18n/.*/authin\.json$">
	Header set Cache-Control "no-cache, no-store, must-revalidate"
	Header set Pragma "no-cache"
	Header unset Expires
</LocationMatch>
